<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Epiphany Anime Starburst Pupil Token -->
  <g id="starburst-pupil">
    <!-- Ambient Cyan Radial Aura Glow -->
    <circle cx="50" cy="50" r="32" fill="#00E5FF" opacity="0.2" />
    <circle cx="50" cy="50" r="18" fill="#00E5FF" opacity="0.35" />

    <!-- Outer Expanded Cyan Aura Star (Opacity 0.5) -->
    <path d="M 50 4 Q 50 44 96 50 Q 50 56 50 96 Q 50 56 4 50 Q 50 44 50 4 Z"
          fill="#00E5FF"
          opacity="0.5" />

    <!-- 45-Degree Diagonal Secondary Diamond Micro-Rays -->
    <g id="diagonal-rays" transform="rotate(45 50 50)">
      <path d="M 50 24 Q 50 46 76 50 Q 50 54 50 76 Q 50 54 24 50 Q 50 46 50 24 Z"
            fill="#00E5FF"
            opacity="0.6" />
      <path d="M 50 30 Q 50 47 70 50 Q 50 53 50 70 Q 50 53 30 50 Q 50 47 50 30 Z"
            fill="#FFFFFF"
            opacity="0.75" />
    </g>

    <!-- Sharp 4-Point Primary Star in Pure White (#FFFFFF) -->
    <path d="M 50 10 Q 50 44 90 50 Q 50 56 50 90 Q 50 56 10 50 Q 50 44 50 10 Z"
          fill="#FFFFFF" />

    <!-- Inner Core Glint Center -->
    <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
