<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- Radial Burst of Carat Gems & Golden Glint Crosses -->
  <g id="carat-cluster-burst">
    <!-- Center Shockwave Origin -->
    <circle cx="120" cy="120" r="22" fill="#00E5FF" opacity="0.18" />
    <circle cx="120" cy="120" r="12" fill="#00E5FF" opacity="0.35" />
    <circle cx="120" cy="120" r="4.5" fill="#FFFFFF" opacity="0.95" />

    <!-- Kinetic Velocity Speed Trails -->
    <g id="velocity-trails" stroke-linecap="round" opacity="0.75">
      <!-- Diagonals to Gems -->
      <line x1="120" y1="120" x2="152" y2="88" stroke="#00E5FF" stroke-width="2" stroke-dasharray="3,5" />
      <line x1="120" y1="120" x2="88" y2="88" stroke="#00E5FF" stroke-width="2" stroke-dasharray="3,5" />
      <line x1="120" y1="120" x2="88" y2="152" stroke="#00E5FF" stroke-width="2" stroke-dasharray="3,5" />
      <line x1="120" y1="120" x2="152" y2="152" stroke="#00E5FF" stroke-width="2" stroke-dasharray="3,5" />
      <!-- Cardinals to Golden Crosses -->
      <line x1="120" y1="120" x2="120" y2="52" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="2,4" />
      <line x1="120" y1="120" x2="188" y2="120" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="2,4" />
      <line x1="120" y1="120" x2="120" y2="188" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="2,4" />
      <line x1="120" y1="120" x2="52" y2="120" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="2,4" />
    </g>

    <!-- 4 Radial Faceted Carat Gems (Expanded Direct Geometry) -->

    <!-- Gem 1: Top-Right (Angle ~35°) -->
    <g id="gem-top-right" transform="translate(168, 72) rotate(35) scale(1.15)">
      <!-- Top Crown Facets -->
      <polygon points="-11,-17 11,-17 0,-4" fill="#00E5FF" />
      <polygon points="-11,-17 -21,-4 -11,-4" fill="#38BDF8" />
      <polygon points="-11,-17 -11,-4 0,-4" fill="#7DD3FC" />
      <polygon points="11,-17 0,-4 11,-4" fill="#00E5FF" />
      <polygon points="11,-17 11,-4 21,-4" fill="#38BDF8" />
      <!-- Lower Pavilion Facets -->
      <polygon points="-21,-4 -11,-4 0,18" fill="#38BDF8" />
      <polygon points="-11,-4 0,-4 0,18" fill="#7DD3FC" />
      <polygon points="0,-4 11,-4 0,18" fill="#0284C7" />
      <polygon points="11,-4 21,-4 0,18" fill="#0369A1" />
      <!-- Rim Highlight -->
      <polygon points="-11,-17 11,-17 21,-4 0,18 -21,-4" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
      <polyline points="-21,-4 -11,-17 11,-17" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-11" cy="-17" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Gem 2: Top-Left (Angle -35°) -->
    <g id="gem-top-left" transform="translate(72, 72) rotate(-35) scale(1.1)">
      <!-- Top Crown Facets -->
      <polygon points="-11,-17 11,-17 0,-4" fill="#00E5FF" />
      <polygon points="-11,-17 -21,-4 -11,-4" fill="#38BDF8" />
      <polygon points="-11,-17 -11,-4 0,-4" fill="#7DD3FC" />
      <polygon points="11,-17 0,-4 11,-4" fill="#00E5FF" />
      <polygon points="11,-17 11,-4 21,-4" fill="#38BDF8" />
      <!-- Lower Pavilion Facets -->
      <polygon points="-21,-4 -11,-4 0,18" fill="#38BDF8" />
      <polygon points="-11,-4 0,-4 0,18" fill="#7DD3FC" />
      <polygon points="0,-4 11,-4 0,18" fill="#0284C7" />
      <polygon points="11,-4 21,-4 0,18" fill="#0369A1" />
      <!-- Rim Highlight -->
      <polygon points="-11,-17 11,-17 21,-4 0,18 -21,-4" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
      <polyline points="-21,-4 -11,-17 11,-17" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-11" cy="-17" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Gem 3: Bottom-Left (Angle -145°) -->
    <g id="gem-bottom-left" transform="translate(70, 168) rotate(-145) scale(1.05)">
      <!-- Top Crown Facets -->
      <polygon points="-11,-17 11,-17 0,-4" fill="#00E5FF" />
      <polygon points="-11,-17 -21,-4 -11,-4" fill="#38BDF8" />
      <polygon points="-11,-17 -11,-4 0,-4" fill="#7DD3FC" />
      <polygon points="11,-17 0,-4 11,-4" fill="#00E5FF" />
      <polygon points="11,-17 11,-4 21,-4" fill="#38BDF8" />
      <!-- Lower Pavilion Facets -->
      <polygon points="-21,-4 -11,-4 0,18" fill="#38BDF8" />
      <polygon points="-11,-4 0,-4 0,18" fill="#7DD3FC" />
      <polygon points="0,-4 11,-4 0,18" fill="#0284C7" />
      <polygon points="11,-4 21,-4 0,18" fill="#0369A1" />
      <!-- Rim Highlight -->
      <polygon points="-11,-17 11,-17 21,-4 0,18 -21,-4" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
      <polyline points="-21,-4 -11,-17 11,-17" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-11" cy="-17" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Gem 4: Bottom-Right (Angle 145°) -->
    <g id="gem-bottom-right" transform="translate(168, 168) rotate(145) scale(1.15)">
      <!-- Top Crown Facets -->
      <polygon points="-11,-17 11,-17 0,-4" fill="#00E5FF" />
      <polygon points="-11,-17 -21,-4 -11,-4" fill="#38BDF8" />
      <polygon points="-11,-17 -11,-4 0,-4" fill="#7DD3FC" />
      <polygon points="11,-17 0,-4 11,-4" fill="#00E5FF" />
      <polygon points="11,-17 11,-4 21,-4" fill="#38BDF8" />
      <!-- Lower Pavilion Facets -->
      <polygon points="-21,-4 -11,-4 0,18" fill="#38BDF8" />
      <polygon points="-11,-4 0,-4 0,18" fill="#7DD3FC" />
      <polygon points="0,-4 11,-4 0,18" fill="#0284C7" />
      <polygon points="11,-4 21,-4 0,18" fill="#0369A1" />
      <!-- Rim Highlight -->
      <polygon points="-11,-17 11,-17 21,-4 0,18 -21,-4" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
      <polyline points="-21,-4 -11,-17 11,-17" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-11" cy="-17" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- 4 Golden Glint Crosses (#F59E0B) (Expanded Direct Geometry) -->

    <!-- North Glint Cross -->
    <g id="glint-north" transform="translate(120, 36) scale(1.25)">
      <circle cx="0" cy="0" r="10" fill="#F59E0B" opacity="0.3" />
      <path d="M 0 -16 Q 0 -2 16 0 Q 0 2 0 16 Q 0 2 -16 0 Q 0 -2 0 -16 Z" fill="#F59E0B" />
      <path d="M 0 -7 Q 0 -1 7 0 Q 0 1 0 7 Q 0 1 -7 0 Q 0 -1 0 -7 Z" transform="rotate(45)" fill="#FDE68A" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- East Glint Cross -->
    <g id="glint-east" transform="translate(204, 120) scale(1.25)">
      <circle cx="0" cy="0" r="10" fill="#F59E0B" opacity="0.3" />
      <path d="M 0 -16 Q 0 -2 16 0 Q 0 2 0 16 Q 0 2 -16 0 Q 0 -2 0 -16 Z" fill="#F59E0B" />
      <path d="M 0 -7 Q 0 -1 7 0 Q 0 1 0 7 Q 0 1 -7 0 Q 0 -1 0 -7 Z" transform="rotate(45)" fill="#FDE68A" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- South Glint Cross -->
    <g id="glint-south" transform="translate(120, 204) scale(1.25)">
      <circle cx="0" cy="0" r="10" fill="#F59E0B" opacity="0.3" />
      <path d="M 0 -16 Q 0 -2 16 0 Q 0 2 0 16 Q 0 2 -16 0 Q 0 -2 0 -16 Z" fill="#F59E0B" />
      <path d="M 0 -7 Q 0 -1 7 0 Q 0 1 0 7 Q 0 1 -7 0 Q 0 -1 0 -7 Z" transform="rotate(45)" fill="#FDE68A" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- West Glint Cross -->
    <g id="glint-west" transform="translate(36, 120) scale(1.25)">
      <circle cx="0" cy="0" r="10" fill="#F59E0B" opacity="0.3" />
      <path d="M 0 -16 Q 0 -2 16 0 Q 0 2 0 16 Q 0 2 -16 0 Q 0 -2 0 -16 Z" fill="#F59E0B" />
      <path d="M 0 -7 Q 0 -1 7 0 Q 0 1 0 7 Q 0 1 -7 0 Q 0 -1 0 -7 Z" transform="rotate(45)" fill="#FDE68A" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Outward Spark Flakes -->
    <circle cx="148" cy="46" r="2.2" fill="#FDE68A" />
    <circle cx="194" cy="92" r="2.5" fill="#00E5FF" />
    <circle cx="194" cy="148" r="2.2" fill="#FDE68A" />
    <circle cx="92" cy="194" r="2.5" fill="#00E5FF" />
    <circle cx="46" cy="148" r="2.2" fill="#FDE68A" />
    <circle cx="46" cy="92" r="2.5" fill="#00E5FF" />
    <circle cx="92" cy="46" r="2.2" fill="#FDE68A" />
  </g>
</svg>
