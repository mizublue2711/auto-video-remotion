<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" fill="none">
  <!-- Epiphany Idea Lightbulb Token -->
  <g id="idea-lightbulb">
    <!-- Ambient Energy Corona Glow -->
    <circle cx="60" cy="62" r="38" fill="#FACC15" opacity="0.16" />
    <circle cx="60" cy="62" r="28" fill="#FEF08A" opacity="0.25" />

    <!-- Radiating Energy Tick Marks -->
    <g id="energy-ticks" stroke="#FACC15" stroke-width="4.5" stroke-linecap="round">
      <!-- 12 O'Clock -->
      <line x1="60" y1="12" x2="60" y2="24" />
      <!-- 1:30 O'Clock -->
      <line x1="88" y1="22" x2="80" y2="33" />
      <!-- 10:30 O'Clock -->
      <line x1="32" y1="22" x2="40" y2="33" />
      <!-- 2:45 O'Clock -->
      <line x1="106" y1="50" x2="94" y2="55" />
      <!-- 9:15 O'Clock -->
      <line x1="14" y1="50" x2="26" y2="55" />
      <!-- 4:00 O'Clock -->
      <line x1="102" y1="82" x2="91" y2="79" stroke-width="4" />
      <!-- 8:00 O'Clock -->
      <line x1="18" y1="82" x2="29" y2="79" stroke-width="4" />
    </g>

    <!-- Bulb Glass Envelope -->
    <path d="M 46 98 C 43 91 32 81 32 62 C 32 46.5 44.5 34 60 34 C 75.5 34 88 46.5 88 62 C 88 81 77 91 74 98 Z"
          fill="#FACC15"
          stroke="#EAB308"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Bulb Core Inner Light / Filament -->
    <g id="filament" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <path d="M 50 94 L 50 78 L 55 70 L 60 76 L 65 70 L 70 78 L 70 94" />
      <circle cx="60" cy="74" r="5" fill="#FEF08A" opacity="0.6" stroke="none" />
    </g>

    <!-- Glass Specular Gloss -->
    <g id="glass-specular">
      <path d="M 40 48 C 45 40 52 38 58 38 C 55 40 48 42 44 48 C 42 51 40 56 40 60 C 38 58 38 52 40 48 Z"
            fill="#FFFFFF"
            opacity="0.8" />
      <circle cx="43" cy="67" r="2.5" fill="#FFFFFF" opacity="0.85" />
    </g>

    <!-- Metallic Screw Base Collar -->
    <g id="screw-base">
      <!-- Ridge 1 -->
      <rect x="46" y="100" width="28" height="6.5" rx="3" fill="#64748B" stroke="#475569" stroke-width="1.5" />
      <line x1="49" y1="102" x2="71" y2="102" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
      <!-- Ridge 2 -->
      <rect x="47" y="108.5" width="26" height="6.5" rx="3" fill="#64748B" stroke="#475569" stroke-width="1.5" />
      <line x1="50" y1="110.5" x2="70" y2="110.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
      <!-- Ridge 3 -->
      <rect x="49" y="117" width="22" height="6" rx="3" fill="#64748B" stroke="#475569" stroke-width="1.5" />
      <line x1="52" y1="119" x2="68" y2="119" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
      <!-- Bottom Contact Terminal -->
      <path d="M 53 124 C 53 129 67 129 67 124 Z" fill="#334155" />
    </g>
  </g>
</svg>
