  <!-- LAYER 2: 8 CARAT COINS (Circular Gold Token Coins with Embossed Hex Facets) -->
  <g id="fx-carat-coins">
    <!-- Coin 0: 0° (East: translate(360, 250)) -->
    <g transform="translate(360, 250)">
      <circle r="14" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <circle r="10" fill="#FBBF24"/>
      <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.6"/>
      <polygon points="0,-6 5,0 0,6 -5,0" fill="#B45309"/>
      <circle cx="-4" cy="-4" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Coin 1: 45° (South-East: translate(328, 328)) -->
    <g transform="translate(328, 328)">
      <circle r="14" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <circle r="10" fill="#FBBF24"/>
      <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.6"/>
