    <g transform="translate(242, 385) rotate(70)">
      <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#2563EB"/>
    </g>
    <g transform="translate(138, 342) rotate(18)">
      <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#F59E0B"/>
    </g>
    <g transform="translate(110, 245) rotate(-52)">
      <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#2563EB"/>
